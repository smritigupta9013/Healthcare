services:
  healthcare-ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare_readmission_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
